name: CI

# Quality gate for every PR and push to main. This catches the failure modes
# that took production down in the past: a merge that dropped a referenced
# symbol (type-check), code importing a package missing from package.json
# (install/type-check/build), and a broken Vercel serverless bundle (esbuild).
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: Build frontend + standalone server
        run: npm run build

      - name: Build Vercel serverless bundle
        # Mirrors the esbuild step in vercel.json's buildCommand so a broken
        # server bundle (e.g. an undeclared dependency) fails CI, not the deploy.
        run: npx esbuild server.ts --bundle --platform=node --target=node20 --format=cjs --outfile=server.generated.cjs

      - name: Smoke test API routes
        # Boots the bundled app and asserts every /api/* route is wired (returns
        # JSON, not 404). Catches deleted/renamed routes a type-check can't.
        env:
          VERCEL: '1'
        run: node scripts/smoke.cjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: UI smoke test (client-side exports)
        # Launches the built frontend in Chromium and asserts the TXT/PDF export
        # buttons actually produce downloads — browser-only behavior that the
        # type-check and API smoke test can't cover.
        run: node scripts/ui-smoke.mjs
