name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build frontend + standalone server
        run: npm run build
      - name: Bundle server for smoke tests
        run: npm run bundle:server
      - name: Smoke test API routes
        env:
          VERCEL: '1'
        run: node scripts/smoke.cjs
      - name: Smoke test billing + metering
        run: node scripts/billing-smoke.cjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: UI smoke test (client-side exports)
        run: node scripts/ui-smoke.mjs
